<title>Группа 163 — Расписание</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0d0f;
    color: #f2f2f2;
    font-family: Arial, sans-serif;
}

button,
input,

textarea {

}

button {

}

.app {
    width: min(1100px, 100%);
    margin: auto;
    padding: 20px;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.title {
    font-size: 25px;
    font-weight: 700;

.subtitle {
    color: #888;
    margin-top: 5px;
    font-size: 14px;

.refresh {
    border: 0;

    padding: 11px 15px;

.refresh:active {

}

.status {
    background: #151518;

    color: #aaa;

/* WEEK */

.week-control {

    grid-template-columns: 45px 1fr 45px;

<div class="app">

<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const SOURCE_URL =
    "https://spbti.ru/studentam/schedule/451";

const CACHE_KEY =
    "group163_schedule_cache";

const HOMEWORK_KEY =
    "group163_homework";

const REFRESH_INTERVAL =
    5 * 60 * 1000;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let schedule = [];

let weeks = [];

let currentWeekIndex = 0;

let selectedLesson = null;


/* =========================================================
   DOM
========================================================= */

const statusElement =
    document.getElementById("status");

const scheduleElement =
    document.getElementById("schedule");

const weekTitle =
    document.getElementById("weekTitle");

const weekDates =
    document.getElementById("weekDates");

const currentWeekLabel =
    document.getElementById("currentWeekLabel");

const homeworkModal =
    document.getElementById("homeworkModal");


/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================================= */

function escapeHTML(value) {

    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatDate(date) {

    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatShortDate(date) {

    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


function dateToISO(date) {

    const y = date.getFullYear();

    const m = String(
        date.getMonth() + 1
    ).padStart(2, "0");

    const d = String(
        date.getDate()
    ).padStart(2, "0");

    return `${y}-${m}-${d}`;
}


function normalizeText(text) {

    return String(text || "")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   FETCH САЙТА
========================================================= */

async function fetchWithTimeout(
    url,
    timeout = 15000
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        const response =
            await fetch(
                url,
                {
                    cache: "no-store",
                    signal: controller.signal
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        return await response.text();

    } finally {

        clearTimeout(timer);
    }
}


/*
    Браузер может запретить запрос
    непосредственно к spbti.ru.

    Поэтому пробуем несколько вариантов.
*/

async function downloadSchedule() {

    const encoded =
        encodeURIComponent(
            SOURCE_URL
        );

    const urls = [

        SOURCE_URL,

        `https://api.allorigins.win/raw?url=${encoded}`,

        `https://corsproxy.io/?url=${encoded}`

    ];

    let lastError = null;

    for (const url of urls) {

        try {

            const html =
                await fetchWithTimeout(url);

            if (
                html &&
                html.length > 300
            ) {

                return html;
            }

        } catch (error) {

            lastError = error;

        }

    }

    throw lastError ||
        new Error(
            "Не удалось получить расписание"
        );
}


/* =========================================================
   ПАРСИНГ РАСПИСАНИЯ
========================================================= */

/*
    СПбТИ может менять HTML страницы.

    Поэтому здесь несколько способов
    найти таблицу расписания.
*/

function parseSchedule(html) {

    const documentParser =
        new DOMParser();

    const doc =
        documentParser.parseFromString(
            html,
            "text/html"
        );

    const result = [];

    const tables =
        [...doc.querySelectorAll("table")];

    for (const table of tables) {

        const rows =
            [...table.querySelectorAll("tr")];

        for (const row of rows) {

            const cells =
                [...row.querySelectorAll("th, td")]
                .map(
                    cell =>
                        normalizeText(
                            cell.innerText
                        )
                );

            if (
                cells.length >= 2 &&
                cells.some(
                    x => x.length > 0
                )
            ) {

                result.push(cells);
            }
        }
    }

    /*
        Если таблиц нет,
        пробуем найти элементы,
        похожие на расписание.
    */

    if (!result.length) {

        const text =
            normalizeText(
                doc.body?.innerText
            );

        if (text) {

            return parseTextSchedule(
                text
            );
        }
    }

    return parseTableSchedule(
        result
    );
}


/*
    Парсим таблицу.
*/

function parseTableSchedule(rows) {

    const lessons = [];

    let currentDate = null;

    let lessonNumber = 0;

    for (const row of rows) {

        const joined =
            row.join(" ");

        /*
            Ищем дату:
            10.09.2026
            10/09/2026
        */

        const dateMatch =
            joined.match(
                /(\d{1,2})[./-](\d{1,2})[./-](\d{4})/
            );

        if (dateMatch) {

            const day =
                Number(dateMatch[1]);

            const month =
                Number(dateMatch[2]) - 1;

            const year =
                Number(dateMatch[3]);

            currentDate =
                new Date(
                    year,
                    month,
                    day
                );

            lessonNumber = 0;
        }

        /*
            Если дата пока не найдена —
            строка может быть заголовком.
        */

        if (!currentDate) {
            continue;
        }

        /*
            Ищем время пары.
        */

        const timeMatch =
            joined.match(
                /\b(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})\b/
            );

        /*
            Из строки выбираем наиболее
            вероятное название предмета.
        */

        const possibleCells =
            row.filter(
                cell =>
                    cell.length > 2 &&
                    !/^\d{1,2}[.:]\d{2}/.test(cell)
            );

        if (!possibleCells.length) {
            continue;
        }

        let subject =
            possibleCells
                .sort(
                    (a, b) =>
                        b.length - a.length
                )[0];

        /*
            Отбрасываем слишком подозрительные
            строки.
        */

        if (
            subject.length < 2 ||
            subject.length > 300
        ) {

            continue;
        }

        lessonNumber++;

        lessons.push({

            id:
                crypto.randomUUID
                ? crypto.randomUUID()
                : Date.now() +
                  Math.random(),

            date:
                dateToISO(
                    currentDate
                ),

            number:
                lessonNumber,

            time:
                timeMatch
                    ? timeMatch[0]
                    : "",

            subject:
                subject,

            raw:
                row

        });
    }

    return lessons;
}


/*
    Резервный текстовый парсер.
*/

function parseTextSchedule(text) {

    const lines =
        text
            .split("\n")
            .map(normalizeText)
            .filter(Boolean);

    const lessons = [];

    let currentDate = null;

    let number = 0;

    for (const line of lines) {

        const dateMatch =
            line.match(
                /(\d{1,2})[./-](\d{1,2})[./-](\d{4})/
            );

        if (dateMatch) {

            currentDate =
                new Date(
                    Number(dateMatch[3]),
                    Number(dateMatch[2]) - 1,
                    Number(dateMatch[1])
                );

            number = 0;

            continue;
        }

        if (!currentDate) {
            continue;
        }

        const timeMatch =
            line.match(
                /\b\d{1,2}:\d{2}\s*[-–—]\s*\d{1,2}:\d{2}\b/
            );

        if (
            line.length < 3 ||
            line.length > 300
        ) {
            continue;
        }

        /*
            Пропускаем технический мусор.
        */

        if (
            /расписание|группа|неделя|личный кабинет/i
                .test(line)
        ) {
            continue;
        }

        number++;

        lessons.push({

            id:
                Date.now() +
                Math.random(),

            date:
                dateToISO(
                    currentDate
                ),

            number,

            time:
                timeMatch
                    ? timeMatch[0]
                    : "",

            subject:
                line

        });
    }

    return lessons;
}


/* =========================================================
   НЕДЕЛИ
========================================================= */

function getMonday(date) {

    const d =
        new Date(date);

    const day =
        d.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(
        d.getDate() + diff
    );

    d.setHours(
        0, 0, 0, 0
    );

    return d;
}


function getSunday(date) {

    const d =
        getMonday(date);

    d.setDate(
        d.getDate() + 6
    );

    return d;
}


function buildWeeks() {

    const map =
        new Map();

    for (const lesson of schedule) {

        const date =
            new Date(
                lesson.date
            );

        const monday =
            getMonday(date);

        const key =
            dateToISO(monday);

        if (!map.has(key)) {

            map.set(
                key,
                {
                    start: monday,
                    lessons: []
                }
            );
        }

        map
            .get(key)
            .lessons
            .push(lesson);
    }

    weeks =
        [...map.values()]
        .sort(
            (a,b) =>
                a.start - b.start
        );

    /*
        Если расписание пустое —
        создаём текущую неделю.
    */

    if (!weeks.length) {

        weeks = [

            {
                start:
                    getMonday(
                        new Date()
                    ),

                lessons: []
            }

        ];
    }

    const currentMonday =
        dateToISO(
            getMonday(
                new Date()
            )
        );

    const found =
        weeks.findIndex(
            week =>
                dateToISO(
                    week.start
                ) === currentMonday
        );

    if (found >= 0) {

        currentWeekIndex =
            found;

    } else {

        currentWeekIndex =
            Math.max(
                0,
                weeks.findIndex(
                    week =>
                        week.start > new Date()
                )
            );
    }
}


/* =========================================================
   РЕНДЕР НЕДЕЛИ
========================================================= */

function renderWeek() {

    const week =
        weeks[currentWeekIndex];

    if (!week) return;

    const start =
        week.start;

    const end =
        getSunday(start);

    weekTitle.textContent =
        `Неделя ${currentWeekIndex + 1}`;

    weekDates.textContent =
        `${formatShortDate(start)} — ${formatShortDate(end)}`;

    const todayMonday =
        dateToISO(
            getMonday(
                new Date()
            )
        );

    if (
        dateToISO(start) ===
        todayMonday
    ) {

        currentWeekLabel.textContent =
            "Текущая неделя";

    } else {

        currentWeekLabel.textContent =
            "";
    }

    /*
        Создаём 7 дней,
        даже если в какой-то день нет пар.
    */

    let html = "";

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const date =
            new Date(start);

        date.setDate(
            start.getDate() + i
        );

        const iso =
            dateToISO(date);

        const lessons =
            week.lessons
                .filter(
                    lesson =>
                        lesson.date === iso
                )
                .sort(
                    (a,b) =>
                        a.number -
                        b.number
                );

        const isToday =
            iso ===
            dateToISO(
                new Date()
            );

        const dayName =
            date.toLocaleDateString(
                "ru-RU",
                {
                    weekday: "long"
                }
            );

        html += `

            <div class="day ${isToday ? "today" : ""}">

                <div class="day-header">

                    <div>

                        <div class="day-name">
                            ${escapeHTML(
                                dayName[0].toUpperCase() +
                                dayName.slice(1)
                            )}

                            ${
                                isToday
                                ? `<span class="today-label">СЕГОДНЯ</span>`
                                : ""
                            }

                        </div>

                        <div class="day-date">
                            ${formatDate(date)}
                        </div>

                    </div>

                </div>

        `;

        if (!lessons.length) {

            html += `
                <div class="lesson">
                    <div style="color:#666">
                        Пар нет
                    </div>
                </div>
            `;

        } else {

            for (const lesson of lessons) {

                html += `

                    <div class="lesson">

                        <div class="lesson-top">

                            <div class="lesson-number">
                                ${lesson.number}
                            </div>

                            <div class="lesson-content">

                                <div class="lesson-name">
                                    ${escapeHTML(
                                        lesson.subject
                                    )}
                                </div>

                                <div class="lesson-meta">

                                    ${
                                        lesson.time
                                            ? "Время: " +
                                              escapeHTML(
                                                  lesson.time
                                              )
                                            : ""
                                    }

                                </div>

                                <div class="lesson-actions">

                                    <button
                                        class="add-homework"
                                        data-lesson-id="${lesson.id}"
                                    >
                                        + ДЗ
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                `;
            }
        }

        html += `
            </div>
        `;
    }

    scheduleElement.innerHTML =
        html;

    /*
        Назначаем кнопкам ДЗ
    */

    document
        .querySelectorAll(
            ".add-homework"
        )
        .forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const lesson =
                        schedule.find(
                            x =>
                                String(x.id) ===
                                String(
                                    button.dataset.lessonId
                                )
                        );

                    if (lesson) {

                        openHomework(
                            lesson
                        );
                    }
                }
            );

        });
}


/* =========================================================
   КЭШ
========================================================= */

function saveCache(html) {

    localStorage.setItem(

        CACHE_KEY,

        JSON.stringify({

            savedAt:
                Date.now(),

            html:
                html

        })

    );
}


function loadCache() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    CACHE_KEY
                )
            );

        return data?.html || null;

    } catch {

        return null;
    }
}


/* =========================================================
   ОБНОВЛЕНИЕ
========================================================= */

async function updateSchedule() {

    statusElement.textContent =
        "Проверяю расписание на сайте…";

    statusElement.className =
        "status";

    try {

        const html =
            await downloadSchedule();

        /*
            Проверяем, действительно ли
            получили страницу расписания.
        */

        if (
            !html ||
            html.length < 300
        ) {

            throw new Error(
                "Пустой ответ"
            );
        }

        saveCache(html);

        const parsed =
            parseSchedule(html);

        if (!parsed.length) {

            /*
                Не затираем старое
                расписание плохим парсингом.
            */

            const cached =
                loadCache();

            if (!schedule.length) {

                schedule =
                    cached
                    ? parseSchedule(
                        cached
                    )
                    : [];
            }

            statusElement.textContent =
                "Сайт доступен, но формат расписания не удалось распознать.";

            statusElement.className =
                "status error";

            buildWeeks();

            renderWeek();

            return;
        }

        /*
            Проверяем, изменилось ли
            расписание.
        */

        const oldData =
            JSON.stringify(
                schedule.map(
                    x => ({
                        date:x.date,
                        number:x.number,
                        time:x.time,
                        subject:x.subject
                    })
                )
            );

        const newData =
            JSON.stringify(
                parsed.map(
                    x => ({
                        date:x.date,
                        number:x.number,
                        time:x.time,
                        subject:x.subject
                    })
                )
            );

        const changed =
            oldData !== newData;

        schedule =
            parsed;

        buildWeeks();

        renderWeek();

        statusElement.textContent =
            changed
                ? "Расписание обновлено — на сайте были изменения."
                : "Расписание актуально.";

        statusElement.className =
            "status online";

    } catch (error) {

        console.error(
            "Ошибка расписания:",
            error
        );

        /*
            Пробуем старый кэш.
        */

        const cached =
            loadCache();

        if (
            cached &&
            !schedule.length
        ) {

            schedule =
                parseSchedule(
                    cached
                );

            buildWeeks();

            renderWeek();
        }

        statusElement.textContent =
            "Нет соединения с сайтом. Показано последнее сохранённое расписание.";

        statusElement.className =
            "status error";
    }
}


/* =========================================================
   ДЗ
========================================================= */

function getHomework() {

    try {

        return JSON.parse(
            localStorage.getItem(
                HOMEWORK_KEY
            )
        ) || [];

    } catch {

        return [];
    }
}


function saveHomework(data) {

    localStorage.setItem(

        HOMEWORK_KEY,

        JSON.stringify(data)

    );
}


function updateHomeworkCount() {

    const data =
        getHomework();

    const count =
        data.filter(
            x => !x.done
        ).length;

    document.getElementById(
        "homeworkCount"
    ).textContent =
        count
            ? `(${count})`
            : "";
}


function renderHomework() {

    const container =
        document.getElementById(
            "homeworkList"
        );

    const data =
        getHomework();

    if (!data.length) {

        container.innerHTML = `

            <div class="empty">

                Заданий пока нет.

                <br>

                Добавить ДЗ можно прямо
                у нужной пары.

            </div>

        `;

        updateHomeworkCount();

        return;
    }

    data.sort(
        (a,b) =>
            new Date(a.date) -
            new Date(b.date)
    );

    container.innerHTML =
        data.map(
            (item,index) => `

                <div class="
                    homework-card
                    ${item.done ? "homework-done" : ""}
                ">

                    <div class="homework-subject">

                        ${escapeHTML(
                            item.subject
                        )}

                    </div>

                    <div class="homework-meta">

                        Пара:
                        ${escapeHTML(
                            item.date
                        )}

                        ${
                            item.deadline
                            ? " · Сдать до " +
                              escapeHTML(
                                  item.deadline
                              )
                            : ""
                        }

                    </div>

                    <div class="homework-text">

                        ${escapeHTML(
                            item.text
                        )}

                    </div>

                    <div class="homework-buttons">

                        <button
                            onclick="toggleHomework(${index})"
                        >
                            ${
                                item.done
                                ? "Вернуть"
                                : "Сделано"
                            }
                        </button>

                        <button
                            onclick="deleteHomework(${index})"
                        >
                            Удалить
                        </button>

                    </div>

                </div>

            `
        )
        .join("");

    updateHomeworkCount();
}


window.toggleHomework =
function(index) {

    const data =
        getHomework();

    data[index].done =
        !data[index].done;

    saveHomework(data);

    renderHomework();
};


window.deleteHomework =
function(index) {

    const data =
        getHomework();

    data.splice(
        index,
        1
    );

    saveHomework(data);

    renderHomework();
};


/* =========================================================
   ОКНО ДОБАВЛЕНИЯ ДЗ
========================================================= */

function openHomework(lesson) {

    selectedLesson =
        lesson;

    document.getElementById(
        "homeworkSubject"
    ).value =
        lesson.subject;

    document.getElementById(
        "homeworkDate"
    ).value =
        lesson.date;

    document.getElementById(
        "homeworkDeadline"
    ).value =
        lesson.date;

    document.getElementById(
        "homeworkText"
    ).value =
        "";

    document.getElementById(
        "selectedLesson"
    ).textContent =
        `${lesson.date} ${
            lesson.time
                ? " · " + lesson.time
                : ""
        }`;

    homeworkModal.classList.add(
        "show"
    );

    document.getElementById(
        "homeworkText"
    ).focus();
}


function closeHomework() {

    homeworkModal.classList.remove(
        "show"
    );

    selectedLesson =
        null;
}


document.getElementById(
    "cancelHomework"
).addEventListener(
    "click",
    closeHomework
);


document.getElementById(
    "saveHomework"
).addEventListener(
    "click",
    () => {

        if (!selectedLesson) {
            return;
        }

        const text =
            document.getElementById(
                "homeworkText"
            ).value.trim();

        if (!text) {

            alert(
                "Напиши задание."
            );

            return;
        }

        const data =
            getHomework();

        data.push({

            id:
                Date.now(),

            subject:
                selectedLesson.subject,

            date:
                document.getElementById(
                    "homeworkDate"
                ).value,

            deadline:
                document.getElementById(
                    "homeworkDeadline"
                ).value,

            text,

            done:
                false

        });

        saveHomework(data);

        closeHomework();

        renderHomework();
    }
);


/* =========================================================
   ПЕРЕКЛЮЧЕНИЕ НЕДЕЛЬ
========================================================= */

document.getElementById(
    "prevWeek"
).addEventListener(
    "click",
    () => {

        if (
            currentWeekIndex > 0
        ) {

            currentWeekIndex--;

            renderWeek();
        }
    }
);


document.getElementById(
    "nextWeek"
).addEventListener(
    "click",
    () => {

        if (
            currentWeekIndex <
            weeks.length - 1
        ) {

            currentWeekIndex++;

            renderWeek();
        }
    }
);


/* =========================================================
   ВКЛАДКИ
========================================================= */

document.getElementById(
    "scheduleTab"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "scheduleTab"
        ).classList.add("active");

        document.getElementById(
            "homeworkTab"
        ).classList.remove("active");

        document.getElementById(
            "schedulePage"
        ).style.display =
            "block";

        document.getElementById(
            "homeworkPage"
        ).style.display =
            "none";
    }
);


document.getElementById(
    "homeworkTab"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "homeworkTab"
        ).classList.add("active");

        document.getElementById(
            "scheduleTab"
        ).classList.remove("active");

        document.getElementById(
            "schedulePage"
        ).style.display =
            "none";

        document.getElementById(
            "homeworkPage"
        ).style.display =
            "block";

        renderHomework();
    }
);


/* =========================================================
   КНОПКА ОБНОВЛЕНИЯ
========================================================= */

document.getElementById(
    "refreshButton"
).addEventListener(
    "click",
    updateSchedule
);


/* =========================================================
   ЗАПУСК
========================================================= */

async function start() {

    /*
        Сначала показываем кэш,
        чтобы пользователь не ждал.
    */

    const cached =
        loadCache();

    if (cached) {

        const parsed =
            parseSchedule(
                cached
            );

        if (parsed.length) {

            schedule =
                parsed;

            buildWeeks();

            renderWeek();

            statusElement.textContent =
                "Показываю сохранённое расписание и проверяю сайт…";
        }
    }

    /*
        Затем получаем свежую версию
        с сайта.
    */

    await updateSchedule();

    renderHomework();

    /*
        Автоматическое обновление
        каждые 5 минут.
    */

    setInterval(
        updateSchedule,
        REFRESH_INTERVAL
    );
}


start();

</script>
