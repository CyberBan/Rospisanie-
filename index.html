<script>

/* =========================================================
   НАСТРОЙКИ
========================================================= */

const SOURCE_URL =
    "https://spbti.ru/studentam/schedule/451";

const CACHE_KEY =
    "group163_schedule_cache";

const HOMEWORK_KEY =
    "group163_homework";

const REFRESH_INTERVAL =
    5 * 60 * 1000;


/* =========================================================
   СОСТОЯНИЕ
========================================================= */

let schedule = [];

let weeks = [];

let currentWeekIndex = 0;

let selectedLesson = null;


/* =========================================================
   DOM
========================================================= */

const statusElement =
    document.getElementById(
        "status"
    );

const scheduleElement =
    document.getElementById(
        "schedule"
    );

const weekTitle =
    document.getElementById(
        "weekTitle"
    );

const weekDates =
    document.getElementById(
        "weekDates"
    );

const currentWeekLabel =
    document.getElementById(
        "currentWeekLabel"
    );

const homeworkModal =
    document.getElementById(
        "homeworkModal"
    );


/* =========================================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================================================= */

function escapeHTML(value) {

    return String(
        value || ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function formatDate(date) {

    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        }
    );
}


function formatShortDate(date) {

    return date.toLocaleDateString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit"
        }
    );
}


function dateToISO(date) {

    const y =
        date.getFullYear();

    const m =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const d =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${y}-${m}-${d}`;
}


function normalizeText(text) {

    return String(
        text || ""
    )
        .replace(
            /\s+/g,
            " "
        )
        .trim();
}


/* =========================================================
   FETCH САЙТА
========================================================= */

async function fetchWithTimeout(
    url,
    timeout = 15000
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store",

                    signal:
                        controller.signal
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        return await response.text();

    } finally {

        clearTimeout(timer);
    }
}


/*
    Браузер может запретить запрос
    непосредственно к spbti.ru.

    Поэтому пробуем несколько вариантов.
*/

async function downloadSchedule() {

    const encoded =
        encodeURIComponent(
            SOURCE_URL
        );

    const attempts = [

        {
            name:
                "прямой запрос",

            url:
                SOURCE_URL,

            isHTML:
                true
        },

        {
            name:
                "Jina Reader",

            url:
                "https://r.jina.ai/http://spbti.ru/studentam/schedule/451",

            isHTML:
                false
        },

        {
            name:
                "AllOrigins",

            url:
                `https://api.allorigins.win/raw?url=${encoded}`,

            isHTML:
                true
        },

        {
            name:
                "CorsProxy",

            url:
                `https://corsproxy.io/?url=${encoded}`,

            isHTML:
                true
        },

        {
            name:
                "CodeTabs",

            url:
                `https://api.codetabs.com/v1/proxy?quest=${encoded}`,

            isHTML:
                true
        }

    ];

    let lastError =
        null;

    for (
        const attempt
        of attempts
    ) {

        try {

            const text =
                await fetchWithTimeout(
                    attempt.url,
                    20000
                );

            if (
                text &&
                text.length > 100
            ) {

                return {
                    text,
                    isHTML:
                        attempt.isHTML,
                    source:
                        attempt.name
                };
            }

        } catch (error) {

            lastError =
                error;

            console.warn(
                `Не сработал ${attempt.name}:`,
                error
            );
        }
    }

    throw (
        lastError ||
        new Error(
            "Не удалось получить расписание ни одним способом"
        )
    );
}


/* =========================================================
   ПАРСИНГ РАСПИСАНИЯ
========================================================= */

function parseSchedule(source) {

    if (
        !source ||
        !source.text
    ) {
        return [];
    }

    if (
        source.isHTML !== false
    ) {

        const doc =
            new DOMParser()
                .parseFromString(
                    source.text,
                    "text/html"
                );

        const result = [];

        for (
            const table
            of [
                ...doc.querySelectorAll(
                    "table"
                )
            ]
        ) {

            for (
                const row
                of [
                    ...table.querySelectorAll(
                        "tr"
                    )
                ]
            ) {

                const cells =
                    [
                        ...row.querySelectorAll(
                            "th, td"
                        )
                    ]
                        .map(
                            cell =>
                                normalizeText(
                                    cell.innerText
                                )
                        );

                if (
                    cells.length >= 2 &&
                    cells.some(Boolean)
                ) {

                    result.push(
                        cells
                    );
                }
            }
        }

        if (result.length) {

            const parsed =
                parseTableSchedule(
                    result
                );

            if (
                parsed.length
            ) {
                return parsed;
            }
        }

        return parseTextSchedule(
            cleanScheduleText(
                doc.body?.innerText ||
                doc.documentElement?.innerText ||
                ""
            )
        );
    }

    return parseTextSchedule(
        cleanScheduleText(
            source.text
        )
    );
}


function cleanScheduleText(text) {

    return String(
        text || ""
    )
        .replace(
            /\r/g,
            ""
        )
        .split("\n")
        .map(
            line =>
                line
                    .replace(
                        /^\s*\|\s*/,
                        ""
                    )
                    .replace(
                        /\s*\|\s*$/,
                        ""
                    )
                    .replace(
                        /\|/g,
                        " "
                    )
                    .replace(
                        /\*\*/g,
                        ""
                    )
                    .replace(
                        /__/g,
                        ""
                    )
                    .replace(
                        /`/g,
                        ""
                    )
                    .trim()
        )
        .filter(
            line =>
                line &&
                !/^[-:| ]+$/.test(
                    line
                )
        )
        .join("\n");
}


/* =========================================================
   ПАРСЕР ТАБЛИЦЫ
========================================================= */

function parseTableSchedule(rows) {

    const lessons = [];

    let currentDate =
        null;

    let lessonNumber =
        0;

    for (
        const row
        of rows
    ) {

        const joined =
            row.join(" ");

        /*
            Ищем дату:
            10.09.2026
            10/09/2026
        */

        const dateMatch =
            joined.match(
                /(\d{1,2})[./-](\d{1,2})[./-](\d{4})/
            );

        if (dateMatch) {

            const day =
                Number(
                    dateMatch[1]
                );

            const month =
                Number(
                    dateMatch[2]
                ) - 1;

            const year =
                Number(
                    dateMatch[3]
                );

            currentDate =
                new Date(
                    year,
                    month,
                    day
                );

            lessonNumber =
                0;
        }

        if (!currentDate) {
            continue;
        }

        /*
            Ищем время пары.
        */

        const timeMatch =
            joined.match(
                /\b(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})\b/
            );

        /*
            Из строки выбираем наиболее
            вероятное название предмета.
        */

        const possibleCells =
            row.filter(
                cell =>
                    cell.length > 2 &&
                    !/^\d{1,2}[.:]\d{2}/.test(
                        cell
                    )
            );

        if (
            !possibleCells.length
        ) {
            continue;
        }

        let subject =
            possibleCells
                .sort(
                    (a, b) =>
                        b.length -
                        a.length
                )[0];

        if (
            subject.length < 2 ||
            subject.length > 300
        ) {
            continue;
        }

        lessonNumber++;

        lessons.push({

            id:
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now() +
                      Math.random(),

            date:
                dateToISO(
                    currentDate
                ),

            number:
                lessonNumber,

            time:
                timeMatch
                    ? timeMatch[0]
                    : "",

            subject:
                subject,

            raw:
                row

        });
    }

    return lessons;
}


/* =========================================================
   РЕЗЕРВНЫЙ ТЕКСТОВЫЙ ПАРСЕР
========================================================= */

function parseTextSchedule(text) {

    const lines =
        cleanScheduleText(
            text
        )
            .split("\n")
            .map(
                normalizeText
            )
            .filter(Boolean);

    const lessons = [];

    let currentDate =
        null;

    let number = 0;

    const seen =
        new Set();

    for (
        const line
        of lines
    ) {

        const dateMatch =
            line.match(
                /(?:^|\D)(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?(?:\D|$)/
            );

        if (dateMatch) {

            let year =
                dateMatch[3]
                    ? Number(
                        dateMatch[3]
                    )
                    : new Date()
                        .getFullYear();

            if (
                year < 100
            ) {
                year += 2000;
            }

            const candidate =
                new Date(
                    year,
                    Number(
                        dateMatch[2]
                    ) - 1,
                    Number(
                        dateMatch[1]
                    )
                );

            if (
                !Number.isNaN(
                    candidate.getTime()
                )
            ) {

                currentDate =
                    candidate;

                number = 0;
            }
        }

        if (!currentDate) {
            continue;
        }

        const timeMatch =
            line.match(
                /\b\d{1,2}:\d{2}\s*[-–—]\s*\d{1,2}:\d{2}\b/
            );

        if (
            line.length < 3 ||
            line.length > 500
        ) {
            continue;
        }

        if (
            /расписание|группа\s*№?|неделя|личный кабинет|войти|меню|фильтр|понедельник|вторник|среда|четверг|пятница|суббота|воскресенье/i
                .test(line)
            &&
            !timeMatch
        ) {
            continue;
        }

        let subject =
            line
                .replace(
                    /\b\d{1,2}:\d{2}\s*[-–—]\s*\d{1,2}:\d{2}\b/g,
                    ""
                )
                .replace(
                    /\s{2,}/g,
                    " "
                )
                .trim();

        if (dateMatch) {

            subject =
                subject
                    .replace(
                        dateMatch[0],
                        ""
                    )
                    .trim();
        }

        if (
            !subject ||
            subject.length < 2 ||
            /^[-–—|:;,.]+$/.test(
                subject
            ) ||
            /^\d+$/.test(
                subject
            )
        ) {
            continue;
        }

        number++;

        const lesson = {

            id:
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now() +
                      Math.random(),

            date:
                dateToISO(
                    currentDate
                ),

            number,

            time:
                timeMatch
                    ? timeMatch[0]
                    : "",

            subject
        };

        const key =
            `${lesson.date}|${lesson.time}|${lesson.subject}`;

        if (
            !seen.has(key)
        ) {

            seen.add(key);

            lessons.push(
                lesson
            );

        } else {

            number--;
        }
    }

    return lessons;
}


/* =========================================================
   НЕДЕЛИ
========================================================= */

function getMonday(date) {

    const d =
        new Date(date);

    const day =
        d.getDay();

    const diff =
        day === 0
            ? -6
            : 1 - day;

    d.setDate(
        d.getDate() + diff
    );

    d.setHours(
        0,
        0,
        0,
        0
    );

    return d;
}


function getSunday(date) {

    const d =
        getMonday(date);

    d.setDate(
        d.getDate() + 6
    );

    return d;
}


function buildWeeks() {

    const map =
        new Map();

    for (
        const lesson
        of schedule
    ) {

        const date =
            new Date(
                lesson.date
            );

        const monday =
            getMonday(
                date
            );

        const key =
            dateToISO(
                monday
            );

        if (
            !map.has(key)
        ) {

            map.set(
                key,
                {
                    start:
                        monday,

                    lessons:
                        []
                }
            );
        }

        map
            .get(key)
            .lessons
            .push(
                lesson
            );
    }

    weeks =
        [
            ...map.values()
        ]
            .sort(
                (a, b) =>
                    a.start -
                    b.start
            );

    if (
        !weeks.length
    ) {

        weeks = [

            {
                start:
                    getMonday(
                        new Date()
                    ),

                lessons:
                    []
            }

        ];
    }

    const currentMonday =
        dateToISO(
            getMonday(
                new Date()
            )
        );

    const found =
        weeks.findIndex(
            week =>
                dateToISO(
                    week.start
                ) ===
                currentMonday
        );

    if (
        found >= 0
    ) {

        currentWeekIndex =
            found;

    } else {

        const next =
            weeks.findIndex(
                week =>
                    week.start >
                    new Date()
            );

        currentWeekIndex =
            next >= 0
                ? next
                : 0;
    }
}


/* =========================================================
   РЕНДЕР НЕДЕЛИ
========================================================= */

function renderWeek() {

    const week =
        weeks[
            currentWeekIndex
        ];

    if (!week) {
        return;
    }

    const start =
        week.start;

    const end =
        getSunday(
            start
        );

    weekTitle.textContent =
        `Неделя ${
            currentWeekIndex + 1
        }`;

    weekDates.textContent =
        `${
            formatShortDate(start)
        } — ${
            formatShortDate(end)
        }`;

    const todayMonday =
        dateToISO(
            getMonday(
                new Date()
            )
        );

    if (
        dateToISO(start) ===
        todayMonday
    ) {

        currentWeekLabel.textContent =
            "Текущая неделя";

    } else {

        currentWeekLabel.textContent =
            "";
    }

    let html =
        "";

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const date =
            new Date(start);

        date.setDate(
            start.getDate() +
            i
        );

        const iso =
            dateToISO(
                date
            );

        const lessons =
            week.lessons
                .filter(
                    lesson =>
                        lesson.date ===
                        iso
                )
                .sort(
                    (a, b) =>
                        a.number -
                        b.number
                );

        const isToday =
            iso ===
            dateToISO(
                new Date()
            );

        const dayName =
            date.toLocaleDateString(
                "ru-RU",
                {
                    weekday:
                        "long"
                }
            );

        html += `

            <div class="day ${
                isToday
                    ? "today"
                    : ""
            }">

                <div class="day-header">

                    <div>

                        <div class="day-name">

                            ${
                                escapeHTML(
                                    dayName[0]
                                        .toUpperCase() +
                                    dayName.slice(1)
                                )
                            }

                            ${
                                isToday
                                    ? `<span class="today-label">СЕГОДНЯ</span>`
                                    : ""
                            }

                        </div>

                        <div class="day-date">
                            ${formatDate(date)}
                        </div>

                    </div>

                </div>
        `;

        if (
            !lessons.length
        ) {

            html += `

                <div class="lesson">

                    <div style="color:#666">
                        Пар нет
                    </div>

                </div>

            `;

        } else {

            for (
                const lesson
                of lessons
            ) {

                html += `

                    <div class="lesson">

                        <div class="lesson-top">

                            <div class="lesson-number">
                                ${
                                    lesson.number
                                }
                            </div>

                            <div class="lesson-content">

                                <div class="lesson-name">
                                    ${
                                        escapeHTML(
                                            lesson.subject
                                        )
                                    }
                                </div>

                                <div class="lesson-meta">

                                    ${
                                        lesson.time
                                            ? "Время: " +
                                              escapeHTML(
                                                  lesson.time
                                              )
                                            : ""
                                    }

                                </div>

                                <div class="lesson-actions">

                                    <button
                                        class="add-homework"
                                        data-lesson-id="${
                                            lesson.id
                                        }"
                                    >
                                        + ДЗ
                                    </button>

                                </div>

                            </div>

                        </div>

                    </div>

                `;
            }
        }

        html += `
            </div>
        `;
    }

    scheduleElement.innerHTML =
        html;

    document
        .querySelectorAll(
            ".add-homework"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        const lesson =
                            schedule.find(
                                x =>
                                    String(x.id) ===
                                    String(
                                        button.dataset.lessonId
                                    )
                            );

                        if (lesson) {

                            openHomework(
                                lesson
                            );
                        }
                    }
                );
            }
        );
}


/* =========================================================
   КЭШ
========================================================= */

function saveCache(html) {

    try {

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({

                savedAt:
                    Date.now(),

                html:
                    html

            })
        );

    } catch (error) {

        console.warn(
            "Не удалось сохранить кэш:",
            error
        );
    }
}


function loadCache() {

    try {

        const data =
            JSON.parse(
                localStorage.getItem(
                    CACHE_KEY
                )
            );

        return (
            data?.html ||
            null
        );

    } catch {

        return null;
    }
}


/* =========================================================
   ОБНОВЛЕНИЕ РАСПИСАНИЯ
========================================================= */

async function updateSchedule() {

    statusElement.textContent =
        "Проверяю расписание на сайте…";

    statusElement.className =
        "status";

    try {

        const downloaded =
            await downloadSchedule();

        if (
            !downloaded ||
            !downloaded.text ||
            downloaded.text.length < 100
        ) {

            throw new Error(
                "Пустой ответ"
            );
        }

        const parsed =
            parseSchedule(
                downloaded
            );

        if (
            !parsed.length
        ) {

            const cached =
                loadCache();

            if (
                !schedule.length
            ) {

                schedule =
                    cached
                        ? parseSchedule({
                            text:
                                cached,
                            isHTML:
                                true
                        })
                        : [];
            }

            statusElement.textContent =
                "Сайт доступен, но формат расписания не удалось распознать.";

            statusElement.className =
                "status error";

            buildWeeks();

            renderWeek();

            return;
        }

        /*
            ВАЖНО:
            сохраняем кэш только после
            успешного распознавания.
        */

        saveCache(
            downloaded.text
        );

        const oldData =
            JSON.stringify(
                schedule.map(
                    x => ({
                        date:
                            x.date,

                        number:
                            x.number,

                        time:
                            x.time,

                        subject:
                            x.subject
                    })
                )
            );

        const newData =
            JSON.stringify(
                parsed.map(
                    x => ({
                        date:
                            x.date,

                        number:
                            x.number,

                        time:
                            x.time,

                        subject:
                            x.subject
                    })
                )
            );

        const changed =
            oldData !==
            newData;

        schedule =
            parsed;

        buildWeeks();

        renderWeek();

        statusElement.textContent =
            changed
                ? `Расписание обновлено (${downloaded.source}).`
                : `Расписание актуально (${downloaded.source}).`;

        statusElement.className =
            "status online";

    } catch (error) {

        console.error(
            "Ошибка расписания:",
            error
        );

        const cached =
            loadCache();

        if (
            cached &&
            !schedule.length
        ) {

            schedule =
                parseSchedule({
                    text:
                        cached,

                    isHTML:
                        true
                });

            buildWeeks();

            renderWeek();
        }

        if (
            schedule.length
        ) {

            statusElement.textContent =
                "Нет соединения с сайтом. Показано последнее сохранённое расписание.";

        } else {

            statusElement.textContent =
                "Не удалось загрузить расписание. Проверь интернет-соединение.";

        }

        statusElement.className =
            "status error";
    }
}


/* =========================================================
   ДОМАШНИЕ ЗАДАНИЯ
========================================================= */

function getHomework() {

    try {

        return (
            JSON.parse(
                localStorage.getItem(
                    HOMEWORK_KEY
                )
            ) || []
        );

    } catch {

        return [];
    }
}


function saveHomework(data) {

    localStorage.setItem(
        HOMEWORK_KEY,
        JSON.stringify(
            data
        )
    );
}


function updateHomeworkCount() {

    const data =
        getHomework();

    const count =
        data.filter(
            x =>
                !x.done
        ).length;

    document.getElementById(
        "homeworkCount"
    ).textContent =
        count
            ? `(${count})`
            : "";
}


function renderHomework() {

    const container =
        document.getElementById(
            "homeworkList"
        );

    const data =
        getHomework();

    if (
        !data.length
    ) {

        container.innerHTML = `

            <div class="empty">

                Заданий пока нет.

                <br>

                Добавить ДЗ можно прямо
                у нужной пары.

            </div>

        `;

        updateHomeworkCount();

        return;
    }

    data.sort(
        (a, b) =>
            new Date(a.date) -
            new Date(b.date)
    );

    container.innerHTML =
        data
            .map(
                (item, index) => `

                    <div class="
                        homework-card
                        ${
                            item.done
                                ? "homework-done"
                                : ""
                        }
                    ">

                        <div class="homework-subject">

                            ${
                                escapeHTML(
                                    item.subject
                                )
                            }

                        </div>

                        <div class="homework-meta">

                            Пара:
                            ${
                                escapeHTML(
                                    item.date
                                )
                            }

                            ${
                                item.deadline
                                    ? " · Сдать до " +
                                      escapeHTML(
                                          item.deadline
                                      )
                                    : ""
                            }

                        </div>

                        <div class="homework-text">

                            ${
                                escapeHTML(
                                    item.text
                                )
                            }

                        </div>

                        <div class="homework-buttons">

                            <button
                                onclick="toggleHomework(${index})"
                            >

                                ${
                                    item.done
                                        ? "Вернуть"
                                        : "Сделано"
                                }

                            </button>

                            <button
                                onclick="deleteHomework(${index})"
                            >
                                Удалить
                            </button>

                        </div>

                    </div>

                `
            )
            .join("");

    updateHomeworkCount();
}


window.toggleHomework =
function(index) {

    const data =
        getHomework();

    if (
        !data[index]
    ) {
        return;
    }

    data[index].done =
        !data[index].done;

    saveHomework(
        data
    );

    renderHomework();
};


window.deleteHomework =
function(index) {

    const data =
        getHomework();

    if (
        !data[index]
    ) {
        return;
    }

    data.splice(
        index,
        1
    );

    saveHomework(
        data
    );

    renderHomework();
};


/* =========================================================
   ОКНО ДОБАВЛЕНИЯ ДЗ
========================================================= */

function openHomework(
    lesson
) {

    selectedLesson =
        lesson;

    document.getElementById(
        "homeworkSubject"
    ).value =
        lesson.subject;

    document.getElementById(
        "homeworkDate"
    ).value =
        lesson.date;

    document.getElementById(
        "homeworkDeadline"
    ).value =
        lesson.date;

    document.getElementById(
        "homeworkText"
    ).value =
        "";

    document.getElementById(
        "selectedLesson"
    ).textContent =
        `${lesson.date}${
            lesson.time
                ? " · " +
                  lesson.time
                : ""
        }`;

    homeworkModal.classList.add(
        "show"
    );

    document.getElementById(
        "homeworkText"
    ).focus();
}


function closeHomework() {

    homeworkModal.classList.remove(
        "show"
    );

    selectedLesson =
        null;
}


document.getElementById(
    "cancelHomework"
).addEventListener(
    "click",
    closeHomework
);


document.getElementById(
    "saveHomework"
).addEventListener(
    "click",
    () => {

        if (
            !selectedLesson
        ) {
            return;
        }

        const text =
            document.getElementById(
                "homeworkText"
            ).value.trim();

        if (!text) {

            alert(
                "Напиши задание."
            );

            return;
        }

        const data =
            getHomework();

        data.push({

            id:
                Date.now(),

            subject:
                selectedLesson.subject,

            date:
                document.getElementById(
                    "homeworkDate"
                ).value,

            deadline:
                document.getElementById(
                    "homeworkDeadline"
                ).value,

            text,

            done:
                false

        });

        saveHomework(
            data
        );

        closeHomework();

        renderHomework();
    }
);


/* =========================================================
   ЗАКРЫТИЕ MODAL ПО ФОНУ
========================================================= */

homeworkModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            homeworkModal
        ) {

            closeHomework();
        }
    }
);


/* =========================================================
   ПЕРЕКЛЮЧЕНИЕ НЕДЕЛЬ
========================================================= */

document.getElementById(
    "prevWeek"
).addEventListener(
    "click",
    () => {

        if (
            currentWeekIndex > 0
        ) {

            currentWeekIndex--;

            renderWeek();
        }
    }
);


document.getElementById(
    "nextWeek"
).addEventListener(
    "click",
    () => {

        if (
            currentWeekIndex <
            weeks.length - 1
        ) {

            currentWeekIndex++;

            renderWeek();
        }
    }
);


/* =========================================================
   ВКЛАДКА РАСПИСАНИЕ
========================================================= */

document.getElementById(
    "scheduleTab"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "scheduleTab"
        ).classList.add(
            "active"
        );

        document.getElementById(
            "homeworkTab"
        ).classList.remove(
            "active"
        );

        document.getElementById(
            "schedulePage"
        ).style.display =
            "block";

        document.getElementById(
            "homeworkPage"
        ).style.display =
            "none";
    }
);


/* =========================================================
   ВКЛАДКА ДЗ
========================================================= */

document.getElementById(
    "homeworkTab"
).addEventListener(
    "click",
    () => {

        document.getElementById(
            "homeworkTab"
        ).classList.add(
            "active"
        );

        document.getElementById(
            "scheduleTab"
        ).classList.remove(
            "active"
        );

        document.getElementById(
            "schedulePage"
        ).style.display =
            "none";

        document.getElementById(
            "homeworkPage"
        ).style.display =
            "block";

        renderHomework();
    }
);


/* =========================================================
   КНОПКА ОБНОВЛЕНИЯ
========================================================= */

document.getElementById(
    "refreshButton"
).addEventListener(
    "click",
    updateSchedule
);


/* =========================================================
   ЗАПУСК
========================================================= */

async function start() {

    /*
        Сначала показываем кэш,
        чтобы пользователь не ждал.
    */

    const cached =
        loadCache();

    if (cached) {

        const parsed =
            parseSchedule({
                text:
                    cached,

                isHTML:
                    true
            });

        if (
            parsed.length
        ) {

            schedule =
                parsed;

            buildWeeks();

            renderWeek();

            statusElement.textContent =
                "Показываю сохранённое расписание и проверяю сайт…";
        }
    }

    /*
        Затем получаем свежую версию
        с сайта.
    */

    await updateSchedule();

    renderHomework();

    /*
        Автоматическое обновление
        каждые 5 минут.
    */

    setInterval(
        updateSchedule,
        REFRESH_INTERVAL
    );
}


start();

</script>
