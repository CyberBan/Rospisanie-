<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Группа 163 — расписание и задания</title>
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Группа 163">
    
    <link rel="manifest" href='data:application/manifest+json;charset=utf-8,{"name":"Группа 163","short_name":"Группа 163","start_url":".","display":"standalone","background_color":"%23f3f4f6","theme_color":"%233b82f6","icons":[{"src":"data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 192 192%22><rect width=%22192%22 height=%22192%22 fill=%22%233b82f6%22/><text x=%2296%22 y=%22120%22 font-size=%22100%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22>163</text></svg>","sizes":"192x192","type":"image/svg+xml"}]}'>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="%233b82f6"/><text x="50" y="65" font-size="50" text-anchor="middle" fill="white" font-family="Arial" font-weight="bold">163</text></svg>'>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .modal { display: none; }
        .modal.active { display: flex; }
        .install-btn { display: none; }
        .install-btn.show { display: inline-block; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen p-4">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold">Группа 163</h1>
            <button id="install-button" class="install-btn bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600 text-sm">
                📱 Установить
            </button>
        </div>
        
        <div class="flex border-b mb-6">
            <button id="tab-schedule" onclick="switchTab('schedule')" class="px-4 py-2 tab-active">Расписание</button>
            <button id="tab-homework" onclick="switchTab('homework')" class="px-4 py-2 text-gray-500">Задания</button>
        </div>

        <!-- Блок Расписания -->
        <div id="content-schedule">
            <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                <div>
                    <p class="text-sm text-gray-500">Источник: spbti.ru/studentam/schedule/451</p>
                    <p id="schedule-status" class="text-xs text-blue-600 font-medium mt-1">Ожидание загрузки...</p>
                </div>
                <button onclick="fetchSchedule()" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-sm flex items-center gap-1">
                    <span>↻</span> Обновить с сайта
                </button>
            </div>
            <div id="schedule-container" class="text-center text-gray-500 py-10">
                <p class="animate-pulse">Анализирую сайт spbti.ru и собираю расписание...</p>
            </div>
        </div>

        <!-- Блок Заданий -->
        <div id="content-homework" class="hidden">
            <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
                <h2 class="text-xl font-semibold">Домашние задания</h2>
                <div class="flex space-x-2">
                    <button onclick="exportHomework()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600 text-sm">💾 Скачать CSV</button>
                    <button onclick="openModal()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">+ Добавить</button>
                </div>
            </div>
            <div id="homework-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="hw-modal" class="modal fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
            <h3 class="text-lg font-bold mb-4">Добавить задание</h3>
            <form id="hw-form" onsubmit="addHomework(event)">
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Предмет</label>
                    <select id="hw-subject" class="w-full border rounded p-2 bg-white" required>
                        <option value="">-- Сначала загрузи расписание --</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-sm font-medium mb-1">Задание</label>
                    <textarea id="hw-task" class="w-full border rounded p-2" rows="3" required placeholder="Например: стр. 45, упр. 3"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">Сдать до</label>
                    <input type="date" id="hw-date" class="w-full border rounded p-2" required>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-600 hover:text-gray-800">Отмена</button>
                    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- Service Worker для офлайн-работы ---
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE = 'group163-v3-real';
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.open(CACHE).then(cache =>
                            cache.match(e.request).then(cached => {
                                const fetchPromise = fetch(e.request).then(response => {
                                    if (response && response.status === 200) cache.put(e.request, response.clone());
                                    return response;
                                }).catch(() => cached);
                                return cached || fetchPromise;
                            })
                        )
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }

        let scheduleData = null;
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-button').classList.add('show');
        });

        document.getElementById('install-button').addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            document.getElementById('install-button').classList.remove('show');
            deferredPrompt = null;
        });

        function switchTab(tab) {
            document.getElementById('content-schedule').classList.toggle('hidden', tab !== 'schedule');
            document.getElementById('content-homework').classList.toggle('hidden', tab !== 'homework');
            document.getElementById('tab-schedule').classList.toggle('tab-active', tab === 'schedule');
            document.getElementById('tab-homework').classList.toggle('tab-active', tab === 'homework');
            document.getElementById('tab-schedule').classList.toggle('text-gray-500', tab !== 'schedule');
            document.getElementById('tab-homework').classList.toggle('text-gray-500', tab !== 'homework');
        }

        // --- ЖЕСТКИЙ ПАРСИНГ САЙТА СПбТИ ---
        async function fetchSchedule() {
            const container = document.getElementById('schedule-container');
            const status = document.getElementById('schedule-status');
            
            container.innerHTML = '<p class="text-blue-500 animate-pulse">🔄 Скачиваю и анализирую страницу spbti.ru...</p>';
            status.textContent = 'Загрузка...';
            status.className = 'text-xs text-blue-600 font-medium mt-1';
            
            const targetUrl = "https://spbti.ru/studentam/schedule/451";
            // Добавляем timestamp, чтобы прокси не отдавал кэш
            const timestamp = Date.now();
            
            // Пробуем два разных прокси для максимальной надежности
            const proxies = [
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}&t=${timestamp}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}&t=${timestamp}`
            ];
            
            let htmlText = null;
            let lastError = null;
            
            for (const proxy of proxies) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 сек таймаут
                    
                    const response = await fetch(proxy, { signal: controller.signal });
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    htmlText = await response.text();
                    break; // Успех, выходим из цикла
                } catch (e) {
                    lastError = e.message;
                    console.warn(`Прокси не сработал:`, e.message);
                }
            }
            
            if (!htmlText) {
                status.textContent = '❌ Ошибка связи с сайтом';
                status.className = 'text-xs text-red-600 font-medium mt-1';
                container.innerHTML = `
                    <div class="text-red-500 py-10 px-4">
                        <p class="font-bold mb-2 text-lg">⚠️ Не удалось получить данные с сайта</p>
                        <p class="text-sm text-gray-600 mb-4">Сайт колледжа или прокси-сервер временно недоступен. Ошибка: ${lastError}</p>
                        <button onclick="fetchSchedule()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 font-medium mb-2 block w-full">
                            🔄 Попробовать снова
                        </button>
                    </div>
                `;
                return;
            }

            try {
                // Парсим HTML в текст
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                const text = doc.body.innerText.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                const schedule = {};
                const daysRegex = /^(Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье)/i;
                const timeRegex = /^(\d{2}:\d{2})\s*[-–—]\s*(\d{2}:\d{2})/;
                
                let currentDay = null;
                let state = 'seeking_day'; // seeking_day, seeking_time, seeking_subject, seeking_room
                
                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    
                    // 1. Ищем день недели
                    if (daysRegex.test(line)) {
                        const match = line.match(daysRegex);
                        currentDay = match[1]; // "Понедельник" и т.д.
                        if (!schedule[currentDay]) schedule[currentDay] = [];
                        state = 'seeking_time';
                        continue;
                    }
                    
                    if (!currentDay) continue;
                    
                    // 2. Ищем время
                    if (state === 'seeking_time') {
                        if (timeRegex.test(line)) {
                            const match = line.match(timeRegex);
                            schedule[currentDay].push({
                                time: `${match[1]} - ${match[2]}`,
                                subject: '',
                                room: ''
                            });
                            state = 'seeking_subject';
                        }
                        continue;
                    }
                    
                    // 3. Ищем предмет
                    if (state === 'seeking_subject') {
                        const lastLesson = schedule[currentDay][schedule[currentDay].length - 1];
                        if (lastLesson) {
                            lastLesson.subject = line;
                            state = 'seeking_room';
                        }
                        continue;
                    }
                    
                    // 4. Ищем аудиторию
                    if (state === 'seeking_room') {
                        const lastLesson = schedule[currentDay][schedule[currentDay].length - 1];
                        if (lastLesson) {
                            lastLesson.room = line;
                            state = 'seeking_time'; // Следующая строка должна быть временем или новым днем
                        }
                        continue;
                    }
                }
                
                // Проверка: если распарсилось меньше 2 дней, структура сайта могла измениться
                if (Object.keys(schedule).length < 2) {
                    console.warn("Распарсилось мало дней. Данные:", schedule);
                    throw new Error("Найдено слишком мало занятий. Возможно, сайт изменил формат отображения.");
                }
                
                scheduleData = schedule;
                renderSchedule();
                populateSubjects();
                
                status.textContent = `✅ Загружено с сайта (обновлено: ${new Date().toLocaleTimeString()})`;
                status.className = 'text-xs text-green-600 font-medium mt-1';
                
            } catch (parseError) {
                console.error("Ошибка парсинга:", parseError);
                status.textContent = '❌ Ошибка анализа данных';
                status.className = 'text-xs text-red-600 font-medium mt-1';
                container.innerHTML = `
                    <div class="text-red-500 py-10 px-4">
                        <p class="font-bold mb-2 text-lg">⚠️ Сайт ответил, но данные не распознаны</p>
                        <p class="text-sm text-gray-600 mb-4">${parseError.message}</p>
                        <p class="text-xs text-gray-500 mb-4">Сайт СПбТИ мог изменить верстку. Напиши разработчику.</p>
                    </div>
                `;
            }
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            if (!scheduleData) return;

            let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
            for (const [day, lessons] of Object.entries(scheduleData)) {
                html += `<div class="border rounded-lg p-4 bg-gray-50 hover:shadow-md transition-shadow">
                    <h3 class="font-bold text-blue-600 mb-3 text-lg border-b pb-2 flex justify-between">
                        ${day}
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded-full self-center">${lessons.length} пар</span>
                    </h3>`;
                if (lessons.length === 0) {
                    html += `<p class="text-gray-400 text-sm">Пар нет</p>`;
                } else {
                    lessons.forEach(l => {
                        html += `<div class="mb-4 text-sm last:mb-0 border-l-2 border-blue-300 pl-3">
                            <div class="font-bold text-gray-800">${l.time}</div>
                            <div class="text-gray-700 font-medium mt-1">${l.subject}</div>
                            <div class="text-gray-500 text-xs mt-1 flex items-start gap-1">
                                <span class="mt-0.5">📍</span> <span>${l.room}</span>
                            </div>
                        </div>`;
                    });
                }
                html += `</div>`;
            }
            html += '</div>';
            container.innerHTML = html;
        }

        // --- ЛОГИКА ЗАДАНИЙ ---
        function populateSubjects() {
            const select = document.getElementById('hw-subject');
            select.innerHTML = '<option value="">-- Выберите предмет из расписания --</option>';
            
            let subjects = new Set();
            if (scheduleData) {
                Object.values(scheduleData).flat().forEach(lesson => {
                    if (lesson.subject) subjects.add(lesson.subject);
                });
            }
            
            if (subjects.size === 0) {
                select.innerHTML = '<option value="">-- Расписание не загружено --</option>';
                return;
            }

            Array.from(subjects).sort().forEach(sub => {
                const option = document.createElement('option');
                option.value = sub;
                option.textContent = sub;
                select.appendChild(option);
            });
        }

        function openModal() {
            if (!scheduleData) {
                alert('Сначала дождись загрузки расписания с сайта, чтобы выбрать предмет!');
                fetchSchedule();
                return;
            }
            populateSubjects();
            document.getElementById('hw-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('hw-modal').classList.remove('active');
            document.getElementById('hw-form').reset();
        }

        function addHomework(e) {
            e.preventDefault();
            const subject = document.getElementById('hw-subject').value;
            const task = document.getElementById('hw-task').value;
            const date = document.getElementById('hw-date').value;

            if (!subject || !task || !date) return;

            let homeworks = JSON.parse(localStorage.getItem('hw_163') || '[]');
            homeworks.push({ subject, task, date, id: Date.now() });
            localStorage.setItem('hw_163', JSON.stringify(homeworks));
            
            closeModal();
            renderHomework();
        }

        function deleteHomework(id) {
            if (!confirm('Удалить это задание?')) return;
            let homeworks = JSON.parse(localStorage.getItem('hw_163') || '[]');
            homeworks = homeworks.filter(hw => hw.id !== id);
            localStorage.setItem('hw_163', JSON.stringify(homeworks));
            renderHomework();
        }

        function renderHomework() {
            const list = document.getElementById('homework-list');
            const homeworks = JSON.parse(localStorage.getItem('hw_163') || '[]');
            
            if (homeworks.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-8 bg-gray-50 rounded-lg">Заданий пока нет 🎉</p>';
                return;
            }

            homeworks.sort((a, b) => new Date(a.date) - new Date(b.date));

            list.innerHTML = homeworks.map(hw => `
                <div class="border-l-4 border-blue-500 bg-white p-4 rounded shadow-sm flex justify-between items-start gap-3">
                    <div class="flex-1">
                        <div class="font-bold text-blue-600">${hw.subject}</div>
                        <div class="text-gray-700 mt-1 whitespace-pre-wrap">${hw.task}</div>
                        <div class="text-xs text-gray-400 mt-2 font-medium">📅 Сдать до: ${new Date(hw.date).toLocaleDateString('ru-RU')}</div>
                    </div>
                    <button onclick="deleteHomework(${hw.id})" class="text-red-400 hover:text-red-600 text-2xl font-bold leading-none px-1" title="Удалить">×</button>
                </div>
            `).join('');
        }

        function exportHomework() {
            const homeworks = JSON.parse(localStorage.getItem('hw_163') || '[]');
            if (homeworks.length === 0) {
                alert('Нет заданий для экспорта');
                return;
            }

            let csv = '\uFEFFПредмет;Задание;Дата сдачи\n';
            homeworks.forEach(hw => {
                csv += `"${hw.subject}";"${hw.task}";"${new Date(hw.date).toLocaleDateString('ru-RU')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.setAttribute('href', URL.createObjectURL(blob));
            link.setAttribute('download', `задания_163_${new Date().toLocaleDateString('ru-RU')}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Старт ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchSchedule(); // Загружаем сразу при открытии
            renderHomework();
            // Автообновление каждые 5 минут (300000 мс)
            setInterval(fetchSchedule, 300000); 
        });
    </script>
</body>
</html>
